name: pdb-prepare-wizard
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - numpy
  - pandas
  - biopython
  - rdkit
  - meeko
  - pyyaml
  - plip
  - matplotlib
  - seaborn
  - jupyter
  - openbabel  # For ligand processing (SDF, MOL2, PDBQT conversions)
  - scikit-learn  # For clustering and machine learning
  - scipy  # For statistical analysis
  - pip
  - pip:
    - openpyxl>=3.1.5
    - questionary>=2.0.1
    - pdb-tools>=2.5.0
